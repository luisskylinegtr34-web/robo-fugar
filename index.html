<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Robô Fuga</title>
<style>
:root{--bg:#e9ebf6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0b12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0b12;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
#cv{display:block;height:min(calc(100dvh - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)),calc((100vw - 24px)*16/9));max-height:900px;width:auto;border-radius:18px;touch-action:none;box-shadow:0 8px 30px #0006}
</style>
</head>
<body>
<canvas id="cv" width="360" height="640"></canvas>
<script>
var cv=document.getElementById("cv"),g=cv.getContext("2d"),W=360,H=640,LW=120;
var st="menu",best=0,mute=false,sc=0,combo=0,bonus=0,spd=260,dist=0,gap=0,prevF=1,shake=0,overT=0,newB=false,p,obs=[],its=[],pt=[],pp=[],bg=[],AC;
try{best=+localStorage.getItem("rfbest")||0}catch(e){}
for(var i=0;i<45;i++)bg.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*2+.6,v:Math.random()*50+20});
function tone(f,d,ty){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),n=AC.createGain();o.type=ty||"square";o.frequency.value=f;n.gain.value=.05;o.connect(n);n.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.07))}catch(e){}}
function lx(l){return LW*l+LW/2}
function reset(){sc=0;combo=0;bonus=0;spd=260;dist=0;gap=0;prevF=1;shake=0;newB=false;obs=[];its=[];pt=[];pp=[];p={l:1,x:lx(1),y:520,sh:0}}
function mv(d){if(st!="play")return;var n=Math.max(0,Math.min(2,p.l+d));if(n!=p.l){p.l=n;tone(520,.04)}}
function boom(x,y,c,n){for(var i=0;i<(n||14);i++){var a=Math.random()*6.28,v=60+Math.random()*180;pt.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,c:c})}}
function pop(x,y,t,c){pp.push({x:x,y:y,t:t,l:.8,c:c})}
function spawn(){
var f=Math.max(0,Math.min(2,prevF+Math.floor(Math.random()*3)-1));prevF=f;
for(var l=0;l<3;l++){if(l!=f&&Math.random()<.7)obs.push({x:lx(l),y:-40,e:["☄️","🪨","👾"][Math.floor(Math.random()*3)]})}
var r=Math.random();
if(r<.7)its.push({x:lx(f),y:-40,k:"s"});else if(r<.76)its.push({x:lx(f),y:-40,k:"h"});
}
function die(){st="over";overT=performance.now();shake=18;boom(p.x,p.y,"#ff5a5a",34);tone(110,.4,"sawtooth");
if(sc>best){best=sc;newB=true;try{localStorage.setItem("rfbest",best)}catch(e){}}}
function update(dt){
spd=Math.min(640,spd+7*dt);var d=spd*dt;dist+=d;gap+=d;
if(gap>=Math.max(150,235-spd*.13)){gap=0;spawn()}
p.x+=(lx(p.l)-p.x)*Math.min(1,dt*18);
obs.forEach(function(o){o.y+=d;
if(!o.dead&&Math.abs(o.y-p.y)<34&&Math.abs(o.x-p.x)<42){
if(p.sh>0){p.sh=0;o.dead=1;combo=0;shake=10;boom(o.x,o.y,"#7fd4ff");tone(180,.2,"sawtooth")}else die()}});
its.forEach(function(it){it.y+=d;
if(!it.dead&&Math.abs(it.y-p.y)<40&&Math.abs(it.x-p.x)<44){
it.dead=1;
if(it.k=="s"){combo++;var m=1+Math.floor(combo/3),v=10*m;bonus+=v;pop(it.x,it.y,"+"+v,"#ffd84a");boom(it.x,it.y,"#ffd84a",8);tone(700+Math.min(combo,12)*40,.08)}
else{p.sh=1;pop(it.x,it.y,"ESCUDO!","#7fd4ff");tone(900,.2,"triangle")}}
else if(!it.dead&&it.k=="s"&&it.y>p.y+50&&!it.miss){it.miss=1;combo=0}});
obs=obs.filter(function(o){return o.y<H+60&&!o.dead});its=its.filter(function(i){return i.y<H+60&&!i.dead});
sc=Math.floor(dist/40)+bonus;
}
function txt(t,x,y,s,c,a){g.font="bold "+s+"px system-ui,sans-serif";g.fillStyle=c;g.textAlign=a||"center";g.textBaseline="middle";g.fillText(t,x,y)}
function draw(){
g.save();
if(shake>0){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake)}
var gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,"#0b1030");gr.addColorStop(1,"#241a55");g.fillStyle=gr;g.fillRect(-20,-20,W+40,H+40);
g.fillStyle="#fff";bg.forEach(function(s){g.globalAlpha=.35+s.s/4;g.fillRect(s.x,s.y,s.s,s.s)});g.globalAlpha=1;
g.strokeStyle="#ffffff22";g.lineWidth=2;g.setLineDash([22,22]);g.lineDashOffset=-(dist%44);
[LW,LW*2].forEach(function(x){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke()});g.setLineDash([]);
g.font="34px system-ui,sans-serif";g.textAlign="center";g.textBaseline="middle";
its.forEach(function(i){g.fillText(i.k=="s"?"⭐":"🛡️",i.x,i.y)});
obs.forEach(function(o){g.fillText(o.e,o.x,o.y)});
if(st!="over"&&p){
if(p.sh>0){g.beginPath();g.arc(p.x,p.y,34,0,6.28);g.strokeStyle="#7fd4ff";g.lineWidth=3;g.stroke()}
g.font="40px system-ui,sans-serif";g.fillText("🤖",p.x,p.y)}
pt.forEach(function(q){g.globalAlpha=Math.max(0,q.l*1.6);g.fillStyle=q.c;g.fillRect(q.x,q.y,5,5)});g.globalAlpha=1;
pp.forEach(function(q){g.globalAlpha=Math.min(1,q.l*2);txt(q.t,q.x,q.y,20,q.c)});g.globalAlpha=1;
g.restore();
txt("🏁 "+sc,14,28,22,"#fff","left");
txt("Recorde "+best,W-52,28,14,"#ffffffaa","right");
txt(mute?"🔇":"🔊",W-24,28,20,"#fff");
if(st=="play"&&combo>1)txt("COMBO x"+(1+Math.floor(combo/3)),14,58,15,"#ffd84a","left");
if(st=="play"&&p.sh>0)txt("🛡️",W-24,58,18,"#fff");
if(st=="menu"||st=="over"){
g.fillStyle="#000a";g.fillRect(0,0,W,H);
if(st=="menu"){
txt("🤖",W/2,190,80,"#fff");txt("ROBÔ FUGA",W/2,270,40,"#fff");
txt("Desvie dos perigos e pegue as ⭐",W/2,320,16,"#cfd3ff");
txt("Toque na esquerda ou direita da tela",W/2,350,14,"#9aa0dd");
txt("Estrelas seguidas aumentam o combo!",W/2,372,14,"#9aa0dd");
txt("TOQUE PARA JOGAR",W/2,450,22,"#ffd84a");
if(best)txt("Recorde: "+best,W/2,490,16,"#fff")}
else{
txt("FIM DE JOGO",W/2,220,36,"#ff7a7a");
txt(sc+" pontos",W/2,290,32,"#fff");
txt(newB?"🏆 NOVO RECORDE!":"Recorde: "+best,W/2,335,18,newB?"#ffd84a":"#cfd3ff");
txt("TOQUE PARA TENTAR DE NOVO",W/2,430,18,"#ffd84a")}}
}
var last=0;
function frame(ts){
var dt=Math.min(.05,(ts-last)/1000||.016);last=ts;
var v=st=="play"?spd:90;
bg.forEach(function(s){s.y+=s.v*dt*(v/200);if(s.y>H){s.y=0;s.x=Math.random()*W}});
if(st=="play")update(dt);
else if(st=="menu"||st=="over"){dist+=40*dt}
shake=Math.max(0,shake-40*dt);
pt.forEach(function(q){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt});pt=pt.filter(function(q){return q.l>0});
pp.forEach(function(q){q.y-=40*dt;q.l-=dt});pp=pp.filter(function(q){return q.l>0});
draw();requestAnimationFrame(frame);
}
function startIf(){if(st=="menu"||(st=="over"&&performance.now()-overT>500)){reset();st="play"}}
cv.addEventListener("pointerdown",function(e){
e.preventDefault();var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
if(x>W-50&&y<44){mute=!mute;return}
if(st=="play")mv(x<W/2?-1:1);else startIf()});
window.addEventListener("keydown",function(e){
var k=e.key;if(k=="ArrowLeft"||k=="a")mv(-1);else if(k=="ArrowRight"||k=="d")mv(1);else if(k==" "||k=="Enter")startIf()});
reset();p.y=520;requestAnimationFrame(frame);
</script>
</body>
</html>
